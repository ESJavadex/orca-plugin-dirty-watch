<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Orca inyecta sus design tokens como CSS custom properties. */
      body {
        margin: 0;
        padding: 12px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: var(--foreground, #ddd);
        background: var(--background, transparent);
      }
      h1 { font-size: 14px; margin: 0 0 8px; }
      p { color: var(--muted-foreground, #999); line-height: 1.5; }
      button {
        display: block;
        margin: 6px 0;
        padding: 6px 10px;
        border: 1px solid var(--border, #555);
        border-radius: 6px;
        background: var(--secondary, #2a2a2a);
        color: var(--foreground, #ddd);
        cursor: pointer;
        font: inherit;
      }
      select { margin: 6px 0; max-width: 100%; font: inherit; }
      .card {
        margin: 10px 0;
        padding: 10px;
        border: 1px solid var(--border, #444);
        border-radius: 8px;
      }
      .status { min-height: 1.4em; white-space: pre-wrap; color: var(--muted-foreground, #999); }
      .branch { color: var(--muted-foreground, #999); font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Dirty Watch</h1>
    <p>
      Notificaciones automáticas cuando un worktree queda con cambios sin
      commitear (y cuando vuelve a estar limpio). Se escanea al cambiar el
      estado de un agente y cada ~2 min; también puedes lanzar el escaneo
      desde la paleta de comandos.
    </p>

    <div class="card">
      <strong id="wt-name">—</strong>
      <div class="branch" id="wt-branch"></div>
      <select id="terms" hidden></select>
      <button id="send" hidden>Escribir «git status» en la terminal</button>
    </div>

    <p class="status" id="status">Cargando…</p>
    <script>
      'use strict'
      var seq = 0
      var pending = {}
      var statusEl = document.getElementById('status')

      function call(action, params) {
        return new Promise(function (resolve) {
          var requestId = 'req-' + ++seq
          window.parent.postMessage(
            { type: 'orca-panel-action', requestId: requestId, action: action, params: params },
            '*'
          )
          function onMessage(event) {
            var data = event.data
            if (!data || data.type !== 'orca-panel-action-result') return
            if (data.requestId !== requestId) return
            window.removeEventListener('message', onMessage)
            resolve(data)
          }
          window.addEventListener('message', onMessage)
        })
      }

      function refresh() {
        call('workspace.readContext').then(function (result) {
          if (!result.ok) {
            statusEl.textContent = 'error: ' + (result.error || result.errorCode)
            return
          }
          if (!result.value) {
            document.getElementById('wt-name').textContent = 'sin worktree activo'
            document.getElementById('wt-branch').textContent = ''
            return
          }
          document.getElementById('wt-name').textContent = result.value.displayName
          document.getElementById('wt-branch').textContent =
            'rama ' + (result.value.branch || '—')
          var termsEl = document.getElementById('terms')
          var sendBtn = document.getElementById('send')
          termsEl.innerHTML = ''
          result.value.terminals.forEach(function (t) {
            var opt = document.createElement('option')
            opt.value = t.id
            opt.textContent = t.id
            termsEl.appendChild(opt)
          })
          termsEl.hidden = result.value.terminals.length === 0
          sendBtn.hidden = result.value.terminals.length === 0
        })
      }

      document.getElementById('send').addEventListener('click', function () {
        call('terminal.sendText', {
          terminalId: document.getElementById('terms').value,
          text: 'git status',
          enter: true
        }).then(function (result) {
          statusEl.textContent = result.ok
            ? 'escrito ✓'
            : 'fallo: ' + (result.error || result.errorCode)
        })
      })

      refresh()
      setInterval(refresh, 15000)
    </script>
  </body>
</html>
